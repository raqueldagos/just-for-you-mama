<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF3EC"/>
      <stop offset="1" stop-color="#F4E6DA"/>
    </linearGradient>
    <linearGradient id="stroke" x1="60" y1="80" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D98F8F"/>
      <stop offset="1" stop-color="#5C8B7C"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- a gentle check-in mark: not a hard corporate checkmark, a soft
       unhurried curve that eases down, then rises, then settles into
       a small circle instead of a sharp tip - the moment of noticing yourself -->
  <path d="M66 118 C 90 150, 104 168, 122 164 C 148 158, 156 108, 190 84"
        fill="none" stroke="url(#stroke)" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="190" cy="84" r="15" fill="#5C8B7C"/>
  <circle cx="185" cy="79" r="4.5" fill="#FBF3EC" opacity="0.6"/>
</svg>
